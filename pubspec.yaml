name: step_tracker
description: Offline pedometer with session-based step tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  pedometer: ^4.2.0
  permission_handler: ^13.0.2
  sensors_plus: ^6.1.1
  sqflite: ^2.4.4
  path: ^1.9.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
